<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="280" fill="url(#bgGrad)" rx="12"/>

  <!-- Soil layer -->
  <path d="M0 195 Q100 185 200 192 Q300 198 400 190 L400 280 L0 280 Z" fill="url(#soilGrad)"/>
  <!-- Soil texture dots -->
  <circle cx="50" cy="220" r="4" fill="#451a03" opacity="0.6"/>
  <circle cx="130" cy="235" r="3" fill="#451a03" opacity="0.5"/>
  <circle cx="220" cy="215" r="5" fill="#451a03" opacity="0.4"/>
  <circle cx="310" cy="230" r="3" fill="#451a03" opacity="0.6"/>
  <circle cx="370" cy="218" r="4" fill="#451a03" opacity="0.5"/>
  <circle cx="80" cy="250" r="3" fill="#451a03" opacity="0.4"/>
  <circle cx="280" cy="255" r="4" fill="#451a03" opacity="0.5"/>
  <!-- Small stones -->
  <ellipse cx="170" cy="240" rx="7" ry="4" fill="#a16207" opacity="0.5"/>
  <ellipse cx="340" cy="250" rx="6" ry="3" fill="#a16207" opacity="0.4"/>

  <!-- === pH METER DEVICE === -->
  <!-- Main body -->
  <rect x="155" y="45" width="90" height="150" rx="16" fill="url(#meterGrad)" stroke="#14532d" stroke-width="3"/>
  <!-- Body highlight -->
  <rect x="160" y="50" width="34" height="140" rx="12" fill="rgba(255,255,255,0.12)"/>

  <!-- Screen bezel -->
  <rect x="165" y="58" width="70" height="72" rx="10" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
  <!-- Screen -->
  <rect x="168" y="61" width="64" height="66" rx="8" fill="url(#screenGrad)"/>
  <!-- Screen glow -->
  <rect x="170" y="63" width="60" height="62" rx="7" fill="#1e3a5f" opacity="0.5"/>

  <!-- pH display value -->
  <text x="200" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#4ade80">6.8</text>
  <text x="200" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8">pH VALUE</text>
  <!-- Small screen indicators -->
  <circle cx="177" cy="122" r="3" fill="#22c55e" opacity="0.8"/>
  <text x="185" y="125" font-family="Arial,sans-serif" font-size="8" fill="#64748b">OPTIMAL</text>

  <!-- pH color scale bar on screen -->
  <rect x="170" y="118" width="8" height="8" rx="2" fill="#ef4444"/>
  <rect x="180" y="118" width="8" height="8" rx="2" fill="#f97316"/>
  <rect x="190" y="118" width="8" height="8" rx="2" fill="#22c55e"/>
  <rect x="200" y="118" width="8" height="8" rx="2" fill="#22c55e"/>
  <rect x="210" y="118" width="8" height="8" rx="2" fill="#3b82f6"/>
  <rect x="220" y="118" width="8" height="8" rx="2" fill="#8b5cf6"/>

  <!-- Indicator arrow -->
  <polygon points="194,116 198,110 202,116" fill="#facc15"/>

  <!-- Power button -->
  <circle cx="200" cy="148" r="10" fill="#0f172a" stroke="#374151" stroke-width="2"/>
  <circle cx="200" cy="148" r="6" fill="#166534"/>
  <text x="200" y="152" text-anchor="middle" font-family="Arial" font-size="9" fill="white">⏻</text>

  <!-- Mode buttons -->
  <rect x="166" y="165" width="22" height="16" rx="5" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <rect x="211" y="165" width="22" height="16" rx="5" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <text x="177" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#94a3b8">pH</text>
  <text x="222" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#94a3b8">TMP</text>

  <!-- Logo on body -->
  <text x="200" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" font-weight="bold">DR.METER</text>

  <!-- === PROBES === -->
  <!-- Left probe connector block -->
  <rect x="178" y="193" width="14" height="12" rx="4" fill="#1f2937"/>
  <!-- Left probe rod -->
  <rect x="183" y="203" width="6" height="75" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <!-- Left probe tip -->
  <polygon points="183,278 186,268 189,278" fill="#6b7280"/>

  <!-- Right probe connector block -->
  <rect x="208" y="193" width="14" height="12" rx="4" fill="#1f2937"/>
  <!-- Right probe rod -->
  <rect x="213" y="203" width="6" height="75" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <!-- Right probe tip -->
  <polygon points="213,278 216,268 219,278" fill="#6b7280"/>

  <!-- Moisture indicators on probes -->
  <ellipse cx="186" cy="230" rx="10" ry="4" fill="#bae6fd" opacity="0.6"/>
  <ellipse cx="216" cy="238" rx="10" ry="4" fill="#bae6fd" opacity="0.6"/>

  <!-- Brand top badge -->
  <rect x="135" y="18" width="130" height="28" rx="14" fill="#1d4ed8"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">Soil pH Tester Kit</text>
</svg>
