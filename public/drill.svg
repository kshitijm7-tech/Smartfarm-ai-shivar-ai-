<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="skyDr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="soilDr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hopperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="280" fill="url(#skyDr)" rx="12"/>

  <!-- Soil -->
  <path d="M0 200 Q100 194 200 200 Q300 206 400 198 L400 280 L0 280 Z" fill="url(#soilDr)"/>
  <!-- Grass line -->
  <rect x="0" y="198" width="400" height="8" fill="#65a30d"/>
  <!-- Soil texture -->
  <circle cx="45" cy="225" r="4" fill="#451a03" opacity="0.5"/>
  <circle cx="150" cy="240" r="3" fill="#451a03" opacity="0.4"/>
  <circle cx="260" cy="220" r="5" fill="#451a03" opacity="0.5"/>
  <circle cx="360" cy="235" r="3" fill="#451a03" opacity="0.4"/>
  <!-- Furrows left behind -->
  <path d="M100 202 Q130 210 160 202" fill="none" stroke="#451a03" stroke-width="2" opacity="0.6"/>
  <path d="M230 205 Q260 212 290 205" fill="none" stroke="#451a03" stroke-width="2" opacity="0.6"/>
  <!-- Seeds in soil -->
  <ellipse cx="120" cy="214" rx="4" ry="3" fill="#ca8a04" opacity="0.8"/>
  <ellipse cx="145" cy="218" rx="4" ry="3" fill="#ca8a04" opacity="0.7"/>
  <ellipse cx="250" cy="216" rx="4" ry="3" fill="#ca8a04" opacity="0.8"/>
  <ellipse cx="275" cy="220" rx="4" ry="3" fill="#ca8a04" opacity="0.7"/>

  <!-- === MANUAL SEED DRILL === -->
  <!-- Main frame bar (horizontal chassis) -->
  <rect x="80" y="148" width="230" height="16" rx="8" fill="url(#frameGrad)" stroke="#1f2937" stroke-width="2"/>

  <!-- === WHEEL LEFT === -->
  <!-- Wheel hub + spokes -->
  <circle cx="115" cy="185" r="38" fill="none" stroke="#374151" stroke-width="10"/>
  <circle cx="115" cy="185" r="30" fill="none" stroke="#4b5563" stroke-width="3"/>
  <!-- Spokes -->
  <line x1="115" y1="147" x2="115" y2="223" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="77" y1="185" x2="153" y2="185" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="88" y1="158" x2="142" y2="212" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="142" y1="158" x2="88" y2="212" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <!-- Hub -->
  <circle cx="115" cy="185" r="12" fill="#374151" stroke="#1f2937" stroke-width="3"/>
  <circle cx="115" cy="185" r="5" fill="#9ca3af"/>
  <!-- Tread -->
  <circle cx="115" cy="185" r="38" fill="none" stroke="#374151" stroke-width="14" stroke-dasharray="8 6"/>

  <!-- === WHEEL RIGHT === -->
  <circle cx="285" cy="185" r="38" fill="none" stroke="#374151" stroke-width="10"/>
  <circle cx="285" cy="185" r="30" fill="none" stroke="#4b5563" stroke-width="3"/>
  <line x1="285" y1="147" x2="285" y2="223" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="247" y1="185" x2="323" y2="185" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="258" y1="158" x2="312" y2="212" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="312" y1="158" x2="258" y2="212" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <circle cx="285" cy="185" r="12" fill="#374151" stroke="#1f2937" stroke-width="3"/>
  <circle cx="285" cy="185" r="5" fill="#9ca3af"/>
  <circle cx="285" cy="185" r="38" fill="none" stroke="#374151" stroke-width="14" stroke-dasharray="8 6"/>

  <!-- === SEED HOPPER === -->
  <!-- Hopper body (trapezoid) -->
  <path d="M155 70 L245 70 L230 150 L170 150 Z" fill="url(#hopperGrad)" stroke="#c2410c" stroke-width="3"/>
  <!-- Hopper top rim -->
  <rect x="145" y="58" width="110" height="20" rx="8" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <!-- Hopper lid -->
  <rect x="148" y="52" width="104" height="14" rx="7" fill="#fb923c"/>
  <!-- Lid label -->
  <text x="200" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">SEED HOPPER</text>

  <!-- Seeds visible inside (top transparent view) -->
  <ellipse cx="180" cy="95" rx="6" ry="4" fill="#fde68a" opacity="0.8"/>
  <ellipse cx="200" cy="88" rx="6" ry="4" fill="#fde68a" opacity="0.9"/>
  <ellipse cx="220" cy="98" rx="5" ry="3.5" fill="#fde68a" opacity="0.8"/>
  <ellipse cx="190" cy="108" rx="5" ry="3.5" fill="#fde68a" opacity="0.7"/>
  <ellipse cx="210" cy="112" rx="6" ry="4" fill="#fde68a" opacity="0.8"/>

  <!-- Hopper label badge -->
  <rect x="162" y="118" width="76" height="22" rx="8" fill="rgba(0,0,0,0.2)"/>
  <text x="200" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white" font-weight="bold">KISSAN</text>
  <text x="200" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">Seed Drill</text>

  <!-- === SEED TUBES === -->
  <rect x="178" y="148" width="10" height="52" rx="5" fill="#92400e" stroke="#78350f" stroke-width="1"/>
  <rect x="212" y="148" width="10" height="52" rx="5" fill="#92400e" stroke="#78350f" stroke-width="1"/>
  <!-- Furrow openers -->
  <path d="M183 200 L178 218 L188 218 Z" fill="#1f2937"/>
  <path d="M217 200 L212 218 L222 218 Z" fill="#1f2937"/>

  <!-- == HANDLE == -->
  <!-- Handle arms -->
  <rect x="155" y="68" width="12" height="8" rx="3" fill="#374151"/>
  <path d="M161 68 L161 25 Q161 18 168 18 L232 18 Q239 18 239 25 L239 68" fill="none" stroke="#374151" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="233" y="68" width="12" height="8" rx="3" fill="#374151"/>
  <!-- Handle grip -->
  <rect x="185" y="10" width="30" height="16" rx="8" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <rect x="188" y="12" width="24" height="12" rx="6" fill="#374151"/>

  <!-- Top badge -->
  <rect x="135" y="238" width="130" height="26" rx="13" fill="#b45309"/>
  <text x="200" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">Manual Seed Drill</text>
</svg>
